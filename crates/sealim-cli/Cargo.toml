[package]
name = "sealim-cli"
description = "Command-line tool to seal and verify Sealim documents"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "sealim"
path = "src/main.rs"

[dependencies]
sealim-core = { path = "../sealim-core", features = ["trust", "keygen"] }
clap = { version = "4.5", features = ["derive", "env"] }
age = { version = "0.11", features = ["armor"] }
argon2 = "0.5"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
rqrr = "0.8"
rpassword = "7.3"
zeroize = "1.8"
getrandom = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
bech32 = "0.9"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
time = "0.3"
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sealim-core = { path = "../sealim-core", features = ["trust"] }