[package]
name = "sealim-wasm"
description = "WebAssembly bindings for Sealim verification"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sealim-core = { path = "../sealim-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
hex = "0.4"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
